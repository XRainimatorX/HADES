[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades"
version = "0.1.0"
description = "Real-time consumer-drone detection and alerting"
readme = "README.md"
requires-python = ">=3.14"
# Versions are pinned to the ones the checks were run with (Python 3.14).
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==5.1.0.95",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "psutil==7.2.2",
    "types-psutil==7.2.2.20261122",
    "black==26.10.1",
    "pylint==4.1.4",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "types-PyYAML==6.0.12.20261122",
]
detect = [
    "ultralytics==8.4.219",
]
train = [
    "ultralytics==8.4.219",
]

[project.scripts]
hades-run = "hades.pipeline:main"
hades-replay = "hades.telemetry:replay_main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hades*", "ml*", "bench*"]

[tool.black]
line-length = 100

[tool.pylint.typecheck]
# OpenCV loads its members at import time, so pylint cannot see them
generated-members = ["cv2.*"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "too-many-instance-attributes", "unused-argument"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/hades", "ml", "bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
