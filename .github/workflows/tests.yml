name: ci

on:
  push:
  pull_request:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: black --check src ml bench tests
      - run: pylint src ml bench
      - run: mypy src ml bench
      - run: bandit -q -r src ml bench
      # The 90% coverage gate (CONTRIBUTING Step 4) is enabled after the skeleton stage.
      - run: pytest
